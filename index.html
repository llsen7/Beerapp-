<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#C8102E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>BrewDex</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="lens"><span></span></div>
    <div class="lights"><i class="r"></i><i class="y"></i><i class="g"></i></div>
    <h1>BrewDex</h1>
    <div class="progress" id="progress"></div>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="dex" class="active"><span>📖</span>Dex</button>
    <button data-tab="drinks"><span>🍻</span>My Drinks</button>
    <button class="catch" id="catchBtn" aria-label="Catch a drink"><span class="ball"></span></button>
    <button data-tab="stats"><span>📊</span>Stats</button>
    <button data-tab="settings"><span>⚙️</span>Data</button>
  </nav>

  <dialog id="modal"><div id="modalBody"></div></dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
